name: 巴士開賣時刻監控

# 目的：測出這幾條預約制巴士每天實際幾點開賣。行程 app 的待辦只記了「幾號要訂」，
#       但幾點開賣各家不同，官網通通沒公開。
#
# 原理：兩個訂票系統都把「可預約的日期」寫在頁面上，上界固定是「今天 + 30 天」——
#       開賣的瞬間往後跳一天。監控上界哪一分鐘變，那就是實際開賣時刻。
#         japanbusonline：頁面顯示「目前可預訂的出發日期 09/09 ～ 10/08」
#         highwaybus    ：原始碼裡有 var displayDates = ["20260908",...,"20261008"]
#       兩者都是伺服器端就寫好的，純 curl 可抓，不必登入也不會誤觸訂票流程。
#
# 已知（使用者實測）：合掌村 台北 08:30（日本 09:30）、上高地 台北 23:00（日本 00:00）。
#       アルピコ那兩筆（戶隱、松本→高山）幾點開賣還不知道，所以早晚兩班都查它。
#
# 為什麼不靠 cron 的觸發時刻：GitHub 的 scheduled workflow 常有數分鐘到數十分鐘的延遲，
#       所以提早啟動，並在單一 job 內自己輪詢兩小時，延遲吃得下。
#
# 相容性：狀態用檔案存而不用關聯陣列，所以 bash 3.2 也跑得動——在 macOS 上就能
#       把 run: 區塊抽出來模擬，不必每次都開容器。

on:
  schedule:
    # UTC 23:20 = 台北 07:20 → 合掌村（08:30）＋ アルピコ
    - cron: '20 23 * * *'
    # UTC 14:20 = 台北 22:20 → 上高地（23:00）＋ アルピコ
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: 監控可預約日期的上界
        shell: bash
        env:
          INTERVAL: 60
          MAX_LOOPS: 120
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e   # 底下用「[ 條件 ] && 指令」，條件不成立回非零，不能讓 -e 殺掉整個 step
          set -u

          now() { TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S'; }

          IDS="shirakawa kamikochi alpico"

          name_of() {
            case "$1" in
              shirakawa) echo "合掌村 濃飛巴士" ;;
              kamikochi) echo "上高地 直達巴士" ;;
              alpico)    echo "アルピコ（戶隱・松本→高山）" ;;
            esac
          }
          use_of() {
            case "$1" in
              shirakawa) echo "10/30" ;;
              kamikochi) echo "10/27" ;;
              alpico)    echo "10/26・10/29" ;;
            esac
          }
          url_of() {
            case "$1" in
              shirakawa) echo "https://japanbusonline.com/zh-tw/CourseSearch/11900040002?AreaCd=421" ;;
              kamikochi) echo "https://japanbusonline.com/zh-tw/DestinationSearch/1" ;;
              alpico)    echo "https://www.highwaybus.com/gp/inbound/inbPlanList?lineId=256" ;;
            esac
          }
          kind_of() {
            case "$1" in
              shirakawa|kamikochi) echo "jbo" ;;
              alpico)              echo "alp" ;;
            esac
          }

          # ---- 探針 ----
          probe() {   # $1 = id
            _u=$(url_of "$1")
            case "$(kind_of "$1")" in
              jbo) curl -sL --max-time 20 "${_u}" 2>/dev/null \
                     | tr -d ' \t\r' | tr '\n' '@' \
                     | grep -oE '[0-9]{2}/[0-9]{2}@*～@*[0-9]{2}/[0-9]{2}' \
                     | tr -d '@' | head -1 | sed 's/.*～//' ;;
              alp) curl -sL --max-time 20 "${_u}" 2>/dev/null \
                     | tr -d ' \t\r\n' \
                     | grep -oE 'displayDates=\[[^]]*\]' \
                     | grep -oE '20[0-9]{6}' | tail -1 ;;
            esac
          }

          # 9/30 之後這些票都訂完了，監控沒有意義
          if [ "$(TZ=Asia/Taipei date +%Y%m%d)" -gt 20260930 ]; then
            echo "已過 2026/09/30，監控目的達成。"
            echo "### 已過 9/30，這個 workflow 可以刪了" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # 狀態用檔案存（bash 3.2 沒有關聯陣列）
          ST=$(mktemp -d)
          get() { cat "${ST}/$1" 2>/dev/null; }
          put() { printf '%s' "$2" > "${ST}/$1"; }

          # 開賣後上界應該長什麼樣（兩種日期格式）
          D30_JBO=$(TZ=Asia/Taipei date -d '+30 days' '+%m/%d')
          D30_ALP=$(TZ=Asia/Taipei date -d '+30 days' '+%Y%m%d')
          d30_of() { case "$(kind_of "$1")" in jbo) echo "${D30_JBO}" ;; alp) echo "${D30_ALP}" ;; esac; }

          # ---- 這次測哪幾條 ----
          case "${SCHEDULE}" in
            '20 23 * * *') WANT="shirakawa alpico"; echo "早班：合掌村 ＋ アルピコ" ;;
            '20 14 * * *') WANT="kamikochi alpico"; echo "晚班：上高地 ＋ アルピコ" ;;
            *)             WANT="${IDS}";           echo "手動觸發：三條都測" ;;
          esac

          for id in ${IDS}; do put "hit_${id}" "SKIP"; put "base_${id}" ""; put "new_${id}" ""; done

          got_any=0
          for id in ${WANT}; do
            b=$(probe "${id}")
            put "base_${id}" "${b}"
            put "hit_${id}" ""
            if [ -n "${b}" ]; then
              got_any=1
              if [ "${b}" = "$(d30_of "${id}")" ]; then
                put "hit_${id}" "MISSED"
                echo "  $(name_of "${id}") 啟動時已是 ${b} — 開賣發生在啟動之前"
              fi
            else
              put "hit_${id}" "NODATA"
              echo "  $(name_of "${id}") 抓不到資料"
            fi
          done

          if [ "${got_any}" = 0 ]; then
            {
              echo "## 全部抓不到資料"
              echo ""
              echo "頁面的可預約日期都抓不到，網站可能改版，要重看 HTML 結構。"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          START="$(now)"
          echo "[${START}] 開始監控"
          for id in ${WANT}; do
            echo "  $(name_of "${id}") 基準：$(get "base_${id}")（開賣後應變成 $(d30_of "${id}")）"
          done

          # ---- 輪詢 ----
          i=0
          while [ "${i}" -lt "${MAX_LOOPS}" ]; do
            pending=0
            for id in ${WANT}; do [ -z "$(get "hit_${id}")" ] && pending=1; done
            [ "${pending}" = 0 ] && break

            sleep "${INTERVAL}"
            i=$((i + 1))
            line="[$(now)] #${i}"

            for id in ${WANT}; do
              if [ -z "$(get "hit_${id}")" ]; then
                cur=$(probe "${id}")
                base=$(get "base_${id}")
                if [ -n "${cur}" ] && [ "${cur}" != "${base}" ]; then
                  t="$(now)"
                  put "hit_${id}" "${t}"
                  put "new_${id}" "${cur}"
                  echo "★ [${t}] $(name_of "${id}") 開賣：${base} → ${cur}"
                fi
              fi
              h=$(get "hit_${id}")
              line="${line}  ${id}=${h:-未變}"
            done
            echo "${line}"
          done

          # ---- 摘要 ----
          fmt() {   # $1=結果 $2=基準 $3=新值
            case "$1" in
              "SKIP")   echo "— 這班不測" ;;
              "NODATA") echo "抓不到資料" ;;
              "MISSED") echo "啟動時已經開賣（排程延遲吃掉了提前量）" ;;
              "")       echo "視窗內沒變化（一直是 \`$2\`）" ;;
              *)        echo "**$1** — \`$2\` → \`$3\`" ;;
            esac
          }

          {
            echo "## 開賣時刻監控"
            echo ""
            echo "於 **${START}**（台北）啟動，每 ${INTERVAL} 秒查一次，誤差在 1 分鐘內。"
            echo ""
            echo "| 路線 | 用在 | 結果 |"
            echo "|---|---|---|"
            for id in ${IDS}; do
              echo "| $(name_of "${id}") | $(use_of "${id}") | $(fmt "$(get "hit_${id}")" "$(get "base_${id}")" "$(get "new_${id}")") |"
            done
            echo ""
            echo "已知的實測值：合掌村 08:30、上高地 23:00（台北時間）。アルピコ那兩筆待測。"
          } >> "${GITHUB_STEP_SUMMARY}"

          rm -rf "${ST}"
          echo "[$(now)] 結束"
